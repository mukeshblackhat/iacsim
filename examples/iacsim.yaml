# Sample iacsim.yaml — every key is optional; this file IS the full default set
# (tests/test_config_docs.py asserts it equals iacsim.core.config.DEFAULTS).
# Copy next to your Terraform and edit. CLI flags override these.
provider: auto                  # aws | gcp | auto = majority resource-type prefix (google_* → gcp), else aws
parsers:
  cloudformation:
    region: null                # CloudFormation has no provider block; null = guess from ARNs, else us-east-1
  terraform:
    region: null                # fallback when a provider's region cannot be resolved (--region)
    workspace: null             # value of terraform.workspace; null = "default" (--workspace)
inference:
  rules: [step_functions, gcp_workflows, event_source_mapping, gcp_eventarc, gcp_pubsub_push,
          lambda_permission, api_gateway_integration, target_group, gcp_lb_chain,
          env_var, iam_policy, gcp_iam_binding, vpc_peering]
scenarios:
  sources: [yaml_file, inferred_from_entrypoints]
latency:
  profiles: [defaults]          # add ./profiles/team.yaml, ./calibrated.yaml ...
  rules: [distance, processing, cold_start, transition]   # transition = one state change per hop out of a state machine
simulation:
  walker: expected_value        # or monte_carlo → p50/p95/p99, or load → users until it breaks
  samples: 10000                # monte_carlo only
  seed: null                    # monte_carlo only; set for reproducible runs
  load: load.yaml               # load walker only: arrival rates, next to scenarios.yaml
  tail_factor: 1.3              # load walker only: p99 ≈ tail_factor × expected before queueing
analysis:
  analyzers: [per_hop, per_node, per_category, critical_path, recommendations, tail_risk, saturation]
                                # tail_risk only speaks when sampled; saturation only with the load walker
  top_n: 10
report:
  outputs: [text, json]
  out_dir: .iacsim
calibrate:                      # `iacsim calibrate <target>` — rung 2, measured numbers
  source: cloudwatch            # any registered metric source: cloudwatch | fake | <your plugin>
  window: 7d                    # 7d | 24h | 30m
  out: calibrated.yaml          # written next to the target; then `iacsim run <target> --profile calibrated.yaml`
                                # (relative --profile/--load/--out resolve against the target dir first, then cwd)
  sources:                      # per-source options → ctor kwargs. Never put credentials here.
    cloudwatch:
      region: null              # null = each node's own region; AWS creds from `aws configure` / AWS_PROFILE
      aws_profile: null         # named AWS profile (read-only: cloudwatch:GetMetricData, ListMetrics)
    fake:
      fixture: null             # e.g. calibrate-fixture.yaml — canned numbers for demos/tests
    # datadog:                  # a company-specific plugin in ./plugins implementing MetricSource
    #   site: datadoghq.eu
    #   api_key_env: DD_API_KEY # the *name* of the env var holding the key
