# Sample iacsim.yaml — every key is optional; this is the full default set.
# Copy next to your Terraform and edit. CLI flags override these.
provider: aws
parsers:
  cloudformation:
    region: null                # CloudFormation has no provider block; null = guess from ARNs, else us-east-1
inference:
  rules: [step_functions, event_source_mapping, lambda_permission,
          api_gateway_integration, target_group, env_var, iam_policy]
scenarios:
  sources: [yaml_file, inferred_from_entrypoints]
  file: scenarios.yaml
latency:
  profiles: [defaults]          # add ./profiles/team.yaml, ./calibrated.yaml ...
  rules: [distance, processing, cold_start, transition]   # transition = one state change per hop out of a state machine
simulation:
  walker: expected_value        # or monte_carlo → p50/p95/p99
  samples: 10000                # monte_carlo only
  seed: null                    # monte_carlo only; set for reproducible runs
analysis:
  analyzers: [per_hop, per_node, per_category, critical_path, recommendations, tail_risk]   # tail_risk only speaks when sampled
  top_n: 10
report:
  outputs: [text, json]
  out_dir: .iacsim
calibrate:                      # `iacsim calibrate <target>` — rung 2, measured numbers
  source: cloudwatch            # any registered metric source: cloudwatch | fake | <your plugin>
  window: 7d                    # 7d | 24h | 30m
  out: calibrated.yaml          # written next to the target; then: --profile calibrated.yaml
  sources:                      # per-source options → ctor kwargs. Never put credentials here.
    cloudwatch:
      region: null              # null = each node's own region; AWS creds from `aws configure` / AWS_PROFILE
      aws_profile: null         # named AWS profile (read-only: cloudwatch:GetMetricData, ListMetrics)
    fake:
      fixture: null             # e.g. calibrate-fixture.yaml — canned numbers for demos/tests
    # datadog:                  # a company-specific plugin in ./plugins implementing MetricSource
    #   site: datadoghq.eu
    #   api_key_env: DD_API_KEY # the *name* of the env var holding the key
