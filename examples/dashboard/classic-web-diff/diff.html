<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iacsim dashboard</title>
<style>
  :root {
    --bg: #fafaf8; --fg: #1f2328; --muted: #6b7280; --panel: #ffffff; --line: #d0d7de;
    --lane: #f1f3f5; --lane-line: #dfe3e8;
    --compute: #4f8bd6; --datastore: #d68a2e; --lb: #7c5cd6; --gateway: #2e9e6b; --queue: #c94f7c;
    --orchestrator: #b05cd6; --cdn: #3ca6b8; --network: #9aa3ad; --external: #8b8f94;
    --distance: #4f8bd6; --processing: #2e9e6b; --cold_start: #e07b1f; --other: #9aa3ad;
    --accent: #e0245e; --faded: 0.18;
    --warn: #d4a017; --sat: #c0392b; --focus: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --fg: #e6e8eb; --muted: #9aa3ad; --panel: #171b21; --line: #2b323b;
            --lane: #151920; --lane-line: #232a33; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .skip { position: absolute; left: -9999px; top: 8px; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--fg); }
  .skip:focus { left: 8px; }
  #notice { padding: 10px 14px; background: var(--panel); border-left: 4px solid var(--warn); }
  #notice code { font-size: 12px; }

  /* ---- header */
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--fg); font-weight: 600; }
  [role="tablist"] { display: flex; flex-wrap: wrap; gap: 4px; }
  [role="tab"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-variant-numeric: tabular-nums; }
  [role="tab"] small { color: var(--muted); margin-left: 6px; }
  [role="tab"][aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  [role="tab"][aria-selected="true"] small { color: var(--bg); opacity: .75; }
  .toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); margin-left: auto; }
  .toggles input { vertical-align: -2px; margin: 0 4px 0 0; }

  /* ---- KPI strip */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 10px 14px 0; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .value.text { font-size: 13px; padding-top: 3px; }
  .kpi .value small { font-size: 12px; color: var(--muted); }
  .kpi.accent { border-color: var(--accent); }
  .kpi.accent .value { color: var(--accent); }
  .kpi a { color: inherit; text-decoration: none; display: block; }

  /* ---- main grid: map + rail; tables, capacity, legend below */
  main { display: grid; grid-template-columns: minmax(0, 65fr) minmax(360px, 35fr); gap: 12px; padding: 10px 14px; position: relative; }
  main:has(#rail:empty) { grid-template-columns: 1fr; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  #map { position: relative; }
  #stage { overflow: auto; padding: 8px; }
  #stage svg { display: block; }
  #stage.fit svg { width: 100%; height: auto; }
  #rail:empty, #tables:empty, #capacity:empty, #warnings:empty { display: none; }
  #rail, #tables, #capacity, #warnings { padding: 12px 14px; }
  #tables, #capacity, #warnings { margin: 0 14px 12px; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(100%, 420px); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, .12); overflow: auto; padding: 12px 14px; z-index: 6; }
  #tooltip { position: absolute; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; box-shadow: 0 4px 14px rgba(0, 0, 0, .15); max-width: 320px; z-index: 5; font-size: 12px; }
  #tooltip b { font-weight: 600; }
  #tooltip .sub { color: var(--muted); }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--lane-line); margin: 5px 0 3px; }
  .bar span { display: block; height: 100%; }
  .breakdown { color: var(--muted); }
  .breakdown i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; background: var(--c); }

  /* ---- legend */
  #legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 0 14px 14px; }
  #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
  #legend .edge::before { height: 3px; border-radius: 2px; vertical-align: 2px; }
  #legend .slowest::before { height: 5px; background: var(--accent); }
  #legend .badge::before { border-radius: 50%; background: var(--accent); }
  #legend .hollow::before { border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); width: 6px; height: 6px; }

  /* ---- the map (SVG) */
  .lane { fill: var(--lane); stroke: var(--lane-line); }
  .lane-label { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .az-label { fill: var(--muted); font-size: 10px; }
  .node { cursor: pointer; outline: none; transition: opacity .15s; }
  .node rect.box { stroke: var(--panel); stroke-width: 1.5; rx: 6; }
  .node text { fill: #fff; font-size: 11px; pointer-events: none; }
  .node .sub { font-size: 9px; opacity: .85; }
  .node .share-bg { fill: var(--lane-line); }
  .node .share { fill: var(--accent); }
  .node .ms { fill: var(--muted); font-size: 10px; text-anchor: end; font-variant-numeric: tabular-nums; }
  .node.muted { opacity: var(--faded); }
  .node.selected rect.box, .node.highlight rect.box { stroke: var(--accent); stroke-width: 3; }
  .node:focus-visible rect.box, .node.hover rect.box { stroke: var(--focus); stroke-width: 3; }
  .edge { outline: none; transition: opacity .15s; }
  .edge path { fill: none; stroke-linecap: round; }
  .edge path.under { stroke: var(--accent); opacity: 0; }
  .edge.on path.under { opacity: .3; }
  .edge.slowest path.under { opacity: 1; }
  .edge.selected path.under, .edge.highlight path.under { stroke: var(--accent); opacity: 1; }
  .edge:focus-visible path.under, .edge.hover path.under { stroke: var(--focus); opacity: .9; }
  .edge path.hit { stroke: transparent; stroke-width: 14px; cursor: pointer; }
  .edge.muted { opacity: var(--faded); }
  .badge { pointer-events: none; }
  .badge circle { fill: var(--accent); stroke: var(--accent); stroke-width: 1.5; }
  .badge text { fill: #fff; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .badge.hollow circle { fill: var(--panel); }
  .badge.hollow text { fill: var(--accent); }
  .slow-label { font-size: 10px; font-weight: 700; fill: var(--accent); text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }

  /* ---- diff page (minimal until WP5) */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
  .tile .name { font-weight: 600; overflow-wrap: anywhere; }
  .tile .delta { font-size: 16px; }
  .tile .worse { color: var(--accent); }
  .tile .better { color: var(--processing); }
  .tile .sub { color: var(--muted); font-size: 12px; }
  h2 { font-size: 13px; margin: 0 0 6px; }
  h3 { font-size: 12px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  ul.changes { margin: 0; padding-left: 18px; }
  ul.changes code { font-size: 12px; }

  /* ---- rail · tables · warnings (WP2) ---- */
  .rail-section + .rail-section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .chip { display: inline-block; font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 4px; background: var(--lane); border: 1px solid var(--lane-line); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip.layer { min-width: 26px; text-align: center; font-weight: 600; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
  .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .num.pct { color: var(--muted); min-width: 38px; }
  .detail { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .where-bar { height: 14px; margin: 4px 0 8px; border-radius: 4px; }
  .where-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 1px 8px; align-items: center; padding: 5px 4px; border-radius: 6px; }
  .where-row .detail, .ranked li .detail { grid-column: 1 / -1; }
  .where-row:hover, .ranked li:hover, .ranked li.hover, .rec:hover { background: var(--lane); }
  .facts { list-style: none; margin: 8px 0 0; padding: 0 4px; font-size: 12px; }
  .facts li { padding: 2px 0; }
  .facts .chip { margin-right: 5px; }
  .ranked { list-style: none; margin: 0; padding: 0; }
  .ranked li { display: grid; grid-template-columns: 18px 1fr auto 60px auto; gap: 1px 8px; align-items: center; padding: 5px 4px; border-radius: 6px; }
  .ranked li.selected { box-shadow: inset 3px 0 var(--accent); }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  .linkish { font: inherit; color: var(--fg); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
  .linkish:hover { text-decoration-color: var(--fg); }
  .mini { display: inline-flex; width: 60px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--lane-line); vertical-align: middle; }
  .mini span { display: block; height: 100%; background: var(--accent); }
  .mini.stack { width: 90px; }
  .rec { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .rec-head { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .rec-head b { overflow-wrap: anywhere; }
  .rec .saves { color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rec .saves small { color: var(--muted); }
  .rec details { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .rec summary { cursor: pointer; }
  .table-section + .table-section { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  .table-wrap { overflow-x: auto; }
  table.findings { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.findings caption { text-align: left; color: var(--muted); font-size: 12px; padding: 0 0 6px; caption-side: top; }
  table.findings th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.findings td { padding: 5px 8px; border-bottom: 1px solid var(--lane-line); vertical-align: top; }
  table.findings th.num, table.findings td.num { text-align: right; }
  table.findings tbody tr[data-key] { cursor: pointer; }
  table.findings tbody tr:hover, table.findings tbody tr.hover { background: var(--lane); }
  table.findings tbody tr.selected td:first-child { box-shadow: inset 3px 0 var(--accent); }
  td.crit { color: var(--accent); text-align: center; }
  td.grp { padding-left: 6px; white-space: nowrap; }
  td.grp.in { border-left: 3px solid var(--line); }
  td.hop, td.branch { overflow-wrap: anywhere; min-width: 160px; }
  td.evidence, td.why { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; min-width: 200px; }
  td.share .mini { margin-right: 6px; }
  .tail-intro { margin: 0 0 8px; color: var(--muted); }
  ul.warnings { margin: 0; padding-left: 18px; }
  ul.warnings li { padding: 2px 0; overflow-wrap: anywhere; }
  ul.warnings .chip { margin-right: 5px; }

  /* ---- capacity (WP4) ---- */
  /* eight categorical series slots (validated light and dark against the panel surfaces) */
  :root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948; }
  @media (prefers-color-scheme: dark) {
    :root { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; }
  }
  #capacity { scroll-margin-top: 8px; }
  #capacity h2 { font-size: 14px; }
  .cap-meta { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
  .cap-meta b { color: var(--fg); font-weight: 600; }
  .cap-meta div + div { margin-top: 2px; }
  .cap-heat { overflow-x: auto; }
  table.heat { table-layout: fixed; width: 100%; border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
  table.heat th, table.heat td { padding: 4px 6px; font-weight: 400; }
  table.heat thead th { text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; padding-bottom: 2px; }
  table.heat thead th small { display: block; font-weight: 400; font-size: 10px; }
  table.heat thead th:first-child { text-align: left; }
  table.heat tbody th { text-align: left; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; }
  table.heat tbody th small { display: block; color: var(--muted); font-size: 11px; }
  table.heat tbody tr:hover th, table.heat tbody tr:focus-visible th { background: var(--lane); }
  table.heat tbody tr:focus-visible { outline-offset: -2px; }
  table.heat td.cell { text-align: center; border-radius: 4px; background: color-mix(in oklab, var(--lane), var(--accent) var(--mix, 0%)); }
  table.heat td.hot { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 600; }
  table.heat td.sat { background: repeating-linear-gradient(45deg, var(--sat) 0 3px, var(--panel) 3px 8px); font-weight: 700; }
  table.heat td.sat span { background: var(--panel); border-radius: 3px; padding: 0 5px; }
  table.heat td.none { color: var(--muted); }
  .cap-chart svg.p99 { display: block; width: 100%; height: auto; max-width: 100%; }
  .p99 .grid line { stroke: var(--lane-line); stroke-width: 1; }
  .p99 .axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .p99 .axis .unit { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
  .p99 .rule { stroke: var(--sat); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .p99 .rule-label { fill: var(--muted); font-size: 10px; }
  .p99 .series path { fill: none; stroke: var(--c); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; opacity: .5; }
  .p99 .series .to-sat { stroke: var(--c); stroke-dasharray: 2 4; opacity: .5; }
  .p99 .series .pt { fill: var(--c); stroke: var(--panel); stroke-width: 2; opacity: .6; }
  .p99 .series.sel path, .p99 .series.sel .pt { opacity: 1; }
  .p99 .series.sel path { stroke-width: 2.5; }
  .p99 .series .hit { fill: transparent; cursor: pointer; outline: none; }
  .p99 .series .hit:focus-visible { outline: 2px solid var(--focus); }
  .p99 .series .end-label { fill: var(--fg); font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; font-variant-numeric: tabular-nums; }
  .p99 .sat-mark { cursor: pointer; outline: none; }
  .p99 .sat-mark rect { fill: var(--panel); stroke: var(--sat); stroke-width: 1.5; }
  .p99 .sat-mark text { fill: var(--sat); font-size: 10px; font-weight: 700; }
  .p99 .sat-mark:focus-visible rect { stroke: var(--focus); }
  .cap-legend { display: flex; flex-wrap: wrap; gap: 2px 8px; margin: 4px 0 0; }
  .cap-legend button { font: inherit; font-size: 12px; color: var(--fg); background: none; border: 0; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  .cap-legend button[aria-pressed="true"] { background: var(--lane); font-weight: 600; }
  .cap-legend button small { color: var(--muted); }
  .cap-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c); vertical-align: middle; margin-right: 5px; }
  .cap-chart details { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .cap-chart summary { cursor: pointer; }
  table.p99-table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--fg); }
  table.p99-table th, table.p99-table td { padding: 2px 8px; border-bottom: 1px solid var(--lane-line); text-align: right; }
  table.p99-table th[scope="row"], table.p99-table thead th:first-child { text-align: left; font-weight: 500; }
  .callout { border-left: 4px solid var(--accent); background: var(--lane); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; }
  .callout.ok { border-left-color: var(--processing); }
  .callout .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .callout .value { font-size: 16px; }
  .callout .sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  table.breaks { border-collapse: collapse; width: 100%; }
  table.breaks th, table.breaks td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--lane-line); vertical-align: top; }
  table.breaks thead th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  table.breaks td.kind { white-space: nowrap; font-weight: 500; }
  table.breaks td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.breaks tr.group th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding-top: 10px; }
</style>
</head>
<body>
<a class="skip" href="#tables">Skip to hop table</a>
<div id="notice" role="status" hidden></div>
<header id="header">
  <h1>iacsim</h1>
  <span class="meta" id="meta"></span>
  <div id="tabs" role="tablist" aria-label="scenarios"></div>
  <div class="toggles" id="toggles">
    <label><input type="checkbox" id="t-network"> network nodes</label>
    <label><input type="checkbox" id="t-alledges"> every inferred edge</label>
    <label><input type="checkbox" id="t-allhops"> all hops</label>
    <label><input type="checkbox" id="t-fit" checked> fit to width</label>
  </div>
</header>
<section id="kpis" class="kpis" aria-label="key numbers"></section>
<main>
  <section id="map" class="panel" aria-label="the map">
    <div id="stage" class="fit"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="tooltip" role="tooltip" hidden></div>
  </section>
  <aside id="rail" class="panel" aria-label="findings"></aside>       <!-- WP2: where the time goes · bottlenecks · recommendations -->
  <div id="drawer" role="dialog" aria-modal="false" hidden></div>      <!-- WP3: node / edge detail -->
</main>
<section id="tables" class="panel" aria-label="tables"></section>     <!-- WP2: hops · critical path · tail risk -->
<section id="capacity" class="panel" aria-label="users until it breaks"></section>  <!-- WP4: heatmap · p99 chart · what breaks first -->

  const key = (src, dst) => `${src}→${dst}`;
  const rev = (k) => k.split("→").reverse().join("→");

  function parseBlob() {
    const el = $("#iacsim-data");
    try { return JSON.parse(el.textContent); } catch (e) { return null; }
  }

  function index(report) {
    data.report = report; data.graph = report.graph;
    data.labelCounts = {};
    for (const n of Object.values(data.graph.nodes)) if (n.label) data.labelCounts[n.label] = (data.labelCounts[n.label] || 0) + 1;
    data.edgesByKey = new Map();
    for (const e of data.graph.edges) {
      const k = key(e.src, e.dst);
      if (!data.edgesByKey.has(k)) data.edgesByKey.set(k, []);
      data.edgesByKey.get(k).push(e);
    }
    data.requestMap = new Set();
    data.scenarios = report.scenarios.map(indexScenario);
  }

  function indexScenario(s) {
    const hops = s.hops.map((h, i) => ({ ...h, index: i + 1, key: key(h.src, h.dst) }));
    const byKey = new Map();         // drawn-edge key → {ms, breakdown, hops}
    const nodes = new Set();
    for (const h of hops) {
      data.requestMap.add(h.key); data.requestMap.add(rev(h.key));
      nodes.add(h.src); nodes.add(h.dst);
      const k = drawnKey(h.key);
      if (!byKey.has(k)) byKey.set(k, { ms: 0, breakdown: {}, hops: [], percentiles: [] });
      const agg = byKey.get(k);
      agg.ms += h.latency_ms; agg.hops.push(h);
      for (const [c, v] of Object.entries(h.breakdown || {})) agg.breakdown[c] = (agg.breakdown[c] || 0) + v;
      if (h.percentiles && h.percentiles.p99 !== undefined) agg.percentiles.push(h.percentiles);
    }
    const slowest = hops.reduce((best, h) => (!best || h.latency_ms > best.latency_ms ? h : best), null);
    const perNode = {};
    for (const f of (s.findings && s.findings.per_node) || []) perNode[f.subject] = f;
    return { hops, byKey, nodes, slowest, maxMs: Math.max(1, ...[...byKey.values()].map((a) => a.ms)), perNode };
  }

  // A hop with no edge of its own (a 0 ms return leg) is drawn on the reverse edge.
  function drawnKey(k) { return data.edgesByKey.has(k) || !data.edgesByKey.has(rev(k)) ? k : rev(k); }

  // Port of InfraGraph.display_name: the label when unique, else the address with
  // `module.` and the provider prefix of the resource type stripped.
  const TYPE_PREFIX = /\.[a-z][a-z0-9]*_(?=[a-z0-9_]+\.[^.[]+(?:\[.*\])?$)/;
  function displayName(id, graph = data.graph, counts = data.labelCounts) {
    const n = graph && graph.nodes[id];
    if (n && n.label && counts && counts[n.label] === 1) return n.label;
    const short = id.replace(/module\./g, "").replace(TYPE_PREFIX, ".");
    return short.endsWith(".this") ? short.slice(0, -5) : short.replace(".this[", "[");
  }
  function hopName(h) { return h.src === h.dst ? `${displayName(h.src)}  (wait)` : `${displayName(h.src)} → ${displayName(h.dst)}`; }

  // ---------------------------------------------------------------- state
  // Structural keys rebuild the SVG (redraw); the rest only toggle classes (applyState).
  const STRUCTURAL = new Set(["scenario", "showNetwork", "allEdges", "allHops", "fit"]);
  const state = { scenario: 0, showNetwork: false, allEdges: false, allHops: false, fit: true,
                  selected: null, hover: null, highlight: null };
  function set(patch) {
    let structural = false;
    for (const [k, v] of Object.entries(patch)) { if (state[k] !== v) { state[k] = v; if (STRUCTURAL.has(k)) structural = true; } }
    if (structural) redraw(); else applyState();
  }
  const current = () => data.scenarios[state.scenario] || null;
  const currentRaw = () => data.report.scenarios[state.scenario] || null;

  function redraw() {
    $$("[role=tab]").forEach((t, i) => { t.setAttribute("aria-selected", String(i === state.scenario)); t.tabIndex = i === state.scenario ? 0 : -1; });
    $("#stage").classList.toggle("fit", state.fit);
    renderKpis();
    drawMap();
    renderFindings();
    capacity.render();
    applyState();
  }

  function applyState() {
    const sel = state.selected, hov = state.hover, hi = state.highlight;
    for (const g of $$("#svg .node")) {
      const id = g.dataset.id;
      g.classList.toggle("selected", !!sel && sel.type === "node" && sel.id === id);
      g.classList.toggle("hover", !!hov && hov.type === "node" && hov.id === id);
      g.classList.toggle("highlight", !!hi && hi.nodes && hi.nodes.has(id));
    }
    for (const g of $$("#svg .edge")) {
      const k = g.dataset.key;
      g.classList.toggle("selected", !!sel && sel.type === "edge" && sel.key === k);
      g.classList.toggle("hover", !!hov && hov.type === "edge" && hov.key === k);
      g.classList.toggle("highlight", !!hi && hi.keys && hi.keys.has(k));
    }
    syncFindings();
    tooltip.update();
  }

  // ---------------------------------------------------------------- layout
  // Region / AZ swimlanes, left to right by longest-path depth from the sources.
  const COL = 190, ROW = 64, NODE_W = 150, NODE_H = 40, PAD_L = 110, PAD_T = 30;
  function visibleNodes() { return Object.values(data.graph.nodes).filter((n) => state.showNetwork || n.kind !== "network"); }
  function visibleEdges(ids) { return data.graph.edges.filter((e) => ids.has(e.src) && ids.has(e.dst) && e.src !== e.dst); }
  function depths(nodes, edges) {
    // longest-path depth from sources, bounded so cycles cannot spin
    const d = {}; nodes.forEach((n) => { d[n.id] = 0; });
    for (let round = 0; round < nodes.length; round++) {
      let changed = false;
      for (const e of edges) if (d[e.dst] < d[e.src] + 1 && d[e.src] + 1 < nodes.length) { d[e.dst] = d[e.src] + 1; changed = true; }
      if (!changed) break;
    }
    return d;
  }
  function layout() {
    const nodes = visibleNodes(), ids = new Set(nodes.map((n) => n.id)), edges = visibleEdges(ids);
    const depth = depths(nodes, edges);
    const lanes = new Map();   // region → [nodes]
    for (const n of nodes) {
      const r = n.kind === "external" ? "internet" : (n.placement.region || "unplaced");
      if (!lanes.has(r)) lanes.set(r, []);
      lanes.get(r).push(n);
    }
    const order = ["internet", ...[...lanes.keys()].filter((k) => k !== "internet" && k !== "unplaced").sort(), "unplaced"].filter((k) => lanes.has(k));
    const pos = {}, bands = []; let y = PAD_T, maxX = 0;
    for (const region of order) {
      const members = lanes.get(region).sort((a, b) => ((a.placement.az || "") < (b.placement.az || "") ? -1 : 1));
      const rows = {};                       // depth → next free row
      let laneRows = 1;
      for (const n of members) {
        const dx = depth[n.id], r = rows[dx] || 0; rows[dx] = r + 1; laneRows = Math.max(laneRows, r + 1);
        pos[n.id] = { x: PAD_L + dx * COL, y: y + 26 + r * ROW, n };
        maxX = Math.max(maxX, PAD_L + dx * COL + NODE_W);
      }
      const h = 26 + laneRows * ROW + 6;
      bands.push({ region, y, h, azs: [...new Set(members.map((m) => m.placement.az).filter(Boolean))] });
      y += h + 12;
    }
    return { pos, bands, edges, width: maxX + 80, height: y + 20 };
  }
  function curve(a, b) {
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2;
    if (a === b) return `M${x1},${y1} c 30,-30 30,30 0,0`;
    if (x2 >= x1) { const c = (x2 - x1) / 2; return `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`; }
    // backwards: loop around below
    const dy = 40; return `M${a.x + NODE_W / 2},${a.y + NODE_H} C${a.x + NODE_W / 2},${a.y + NODE_H + dy} ${b.x + NODE_W / 2},${b.y + NODE_H + dy} ${b.x + NODE_W / 2},${b.y + NODE_H}`;
  }
  function midpoint(a, b, i) {
    if (a === b) return { x: a.x + NODE_W + 14, y: a.y - 4 + (i % 3) * 10 };
    return { x: (a.x + NODE_W + b.x) / 2, y: (a.y + b.y) / 2 + NODE_H / 2 - 12 + (i % 4) * 6 };
  }
  function dominant(breakdown) {
    let best = "other", bv = -1;
    for (const [k, v] of Object.entries(breakdown || {})) { const c = CATS.includes(k) ? k : "other"; if (v > bv) { bv = v; best = c; } }
    return best;
  }

  // ---------------------------------------------------------------- svg
  // The map: request-map edges (or every edge), width = the selected scenario's hop ms,
  // colour = dominant category, accent under-stroke on the path, the slowest hop marked.
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(svgNS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  function drawMap() {
    const svg = $("#svg"); svg.innerHTML = "";
    const L = layout(), sc = current();
    svg.setAttribute("viewBox", `0 0 ${L.width} ${L.height}`);
    svg.setAttribute("width", L.width); svg.setAttribute("height", L.height);
    svg.style.maxWidth = state.fit ? `${L.width}px` : "";
    const defs = el("defs", {}, svg);
    for (const c of CATS) {
      const m = el("marker", { id: `arrow-${c}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 13, markerHeight: 13, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse" }, defs);  // fixed size, not × stroke width
      el("path", { d: "M0,0 L10,5 L0,10 z", fill: `var(--${c})` }, m);
    }
    for (const b of L.bands) {
      el("rect", { class: "lane", x: 8, y: b.y, width: L.width - 16, height: b.h, rx: 8 }, svg);
      el("text", { class: "lane-label", x: 18, y: b.y + 16 }, svg).textContent = b.region;
      if (b.azs.length) el("text", { class: "az-label", x: 18, y: b.y + 30 }, svg).textContent = b.azs.join(" · ");
    }
    const drawn = L.edges.filter((e) => state.allEdges || data.requestMap.has(key(e.src, e.dst)));
    const seen = new Set();
    const edgesG = el("g", { class: "edges" }, svg);
    for (const e of drawn) {
      const k = key(e.src, e.dst);
      if (seen.has(k)) continue;           // several edges on one pair draw once
      seen.add(k);
      drawEdge(edgesG, e, k, L, sc);
    }
    const nodesG = el("g", { class: "nodes" }, svg);
    for (const [id, p] of Object.entries(L.pos)) drawNode(nodesG, id, p, sc);
    if (sc) drawBadges(svg, L, sc);
  }

  function drawEdge(parent, e, k, L, sc) {
    const a = L.pos[e.src], b = L.pos[e.dst];
    const agg = sc && sc.byKey.get(k);
    const on = !!agg;
    const breakdown = on ? agg.breakdown : e.latency && e.latency.breakdown;
    const cat = dominant(breakdown);
    const w = on ? 1.5 + 8 * Math.sqrt(agg.ms / sc.maxMs) : 1.5;
    const slowest = on && sc.slowest && agg.hops.includes(sc.slowest);
    const cls = ["edge", on ? "on" : "", slowest ? "slowest" : "", !data.requestMap.has(k) && !on ? "muted" : "", sc && !on ? "muted" : ""].join(" ");
    const g = el("g", { class: cls, "data-key": k, tabindex: 0, role: "button",
                        "aria-label": `${displayName(e.src)} → ${displayName(e.dst)}${on ? ", " + fmt.ms(agg.ms) : ""}` }, parent);
    const d = curve(a, b);
    el("path", { d, class: "under", "stroke-width": w + 5 }, g);
    el("path", { d, class: "line", stroke: `var(--${cat})`, "stroke-width": w, "marker-end": `url(#arrow-${cat})` }, g);
    el("path", { d, class: "hit" }, g);
    if (slowest) {
      const m = midpoint(a, b, 0);
      el("text", { class: "slow-label", x: m.x, y: m.y - 14 }, g).textContent = `slowest · ${fmt.ms(sc.slowest.latency_ms)}`;
    }
    wire(g, { type: "edge", key: k });
  }

  function drawNode(parent, id, p, sc) {
    const n = p.n, onPath = sc ? sc.nodes.has(id) : false;
    const touched = data.scenarios.some((s) => s.nodes.has(id));
    const finding = sc && sc.perNode[id];
    const g = el("g", { class: ["node", sc && !onPath ? "muted" : !touched ? "muted" : ""].join(" "), transform: `translate(${p.x},${p.y})`,
                        "data-id": id, tabindex: 0, role: "button", "aria-label": `${displayName(id)}, ${n.kind}` }, parent);
    el("rect", { class: "box", width: NODE_W, height: NODE_H, fill: `var(--${KINDS.includes(n.kind) ? n.kind : "other"})` }, g);
    el("text", { x: 8, y: 16 }, g).textContent = fmt.clip(displayName(id), 22);
    el("text", { x: 8, y: 31, class: "sub" }, g).textContent = `${n.subtype}${n.placement.az ? " · " + n.placement.az : ""}`;
    if (finding) {                          // share of the scenario's total, under the box
      const barW = NODE_W - 46;
      el("rect", { class: "share-bg", x: 0, y: NODE_H + 5, width: barW, height: 4, rx: 2 }, g);
      el("rect", { class: "share", x: 0, y: NODE_H + 5, width: Math.max(2, barW * Math.min(1, finding.share)), height: 4, rx: 2 }, g);
      el("text", { class: "ms", x: NODE_W, y: NODE_H + 10 }, g).textContent = fmt.n(finding.latency_ms);
    }
    wire(g, { type: "node", id });
  }

  function drawBadges(svg, L, sc) {
    const g = el("g", { class: "badges" }, svg);
    for (const h of sc.hops) {              // hop numbers at the midpoint of each path edge
      const a = L.pos[h.src], b = L.pos[h.dst]; if (!a || !b) continue;
      const m = midpoint(a, b, h.index);
      const badge = el("g", { class: `badge${h.on_critical_path ? "" : " hollow"}`, transform: `translate(${m.x},${m.y})` }, g);
      el("circle", { r: 9 }, badge); el("text", {}, badge).textContent = h.index;
    }
  }

  // hover / focus → tooltip; click / Enter / Space → selection
  function wire(g, ref) {
    g.addEventListener("mouseenter", () => set({ hover: ref }));
    g.addEventListener("mouseleave", () => set({ hover: null }));
    g.addEventListener("focus", () => set({ hover: ref }));
    g.addEventListener("blur", () => set({ hover: null }));
    g.addEventListener("click", (ev) => { ev.stopPropagation(); select(ref); });
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(ref); } });
  }
  function same(a, b) { return !!a && !!b && a.type === b.type && a.id === b.id && a.key === b.key; }
  function select(ref) { set({ selected: same(state.selected, ref) ? null : ref }); }

  // ---------------------------------------------------------------- tooltip
  // One element, positioned beside the hovered / focused node or edge.
  const tooltip = {
    update() {
      const t = $("#tooltip"), h = state.hover;
      if (!h) { t.hidden = true; return; }
      const target = h.type === "node" ? $(`#svg .node[data-id="${CSS.escape(h.id)}"]`) : $(`#svg .edge[data-key="${CSS.escape(h.key)}"]`);
      if (!target) { t.hidden = true; return; }
      t.innerHTML = h.type === "node" ? tooltip.node(h.id) : tooltip.edge(h.key);
      t.hidden = false;
      const stage = $("#stage").getBoundingClientRect(), box = target.getBoundingClientRect();
      let x = box.left - stage.left + $("#stage").scrollLeft + box.width / 2 + 12;
      let y = box.top - stage.top + $("#stage").scrollTop + box.height / 2 + 12;
      x = Math.min(x, stage.width - t.offsetWidth - 8); y = Math.min(y, stage.height + $("#stage").scrollTop - t.offsetHeight - 8);
      t.style.left = `${Math.max(0, x)}px`; t.style.top = `${Math.max(0, y)}px`;
    },
    node(id) {
      const n = data.graph.nodes[id], sc = current(), f = sc && sc.perNode[id];
      const place = [n.placement.region, n.placement.az].filter(Boolean).join(" · ") || "unplaced";
      const raw = currentRaw();
      return `<b>${esc(displayName(id))}</b><div class="sub">${esc(n.kind)} / ${esc(n.subtype)} · ${esc(place)}</div>` +
        (f ? `<div><b>${fmt.ms(f.latency_ms)}</b> · ${fmt.pct(f.share)} of ${esc(raw.name)}</div><div class="sub">${esc(f.detail)}</div>`
           : sc ? `<div class="sub">not on ${esc(raw.name)}</div>` : "");
    },
    edge(k) {
      const sc = current(), agg = sc && sc.byKey.get(k), e = (data.edgesByKey.get(k) || [])[0];
      const [src, dst] = k.split("→");
      let html = `<b>${esc(displayName(src))} → ${esc(displayName(dst))}</b>`;
      if (agg) {
        const ps = agg.percentiles;
        html += `<div><b>${fmt.ms(agg.ms)}</b>${agg.hops.length > 1 ? ` <span class="sub">· ${agg.hops.length} hops on this edge</span>` : ""}</div>` +
          stackedBar(agg.breakdown) +
          (ps.length ? `<div class="sub">p50 ${fmt.n(ps.reduce((s, p) => s + (p.p50 || 0), 0))} · p99 ${fmt.n(ps.reduce((s, p) => s + (p.p99 || 0), 0))} ms</div>` : "");
      } else if (e && e.latency) {
        html += `<div><b>${fmt.ms(e.latency.expected)}</b> <span class="sub">one-way expected</span></div>` + stackedBar(e.latency.breakdown);
      }
      if (e) html += `<div class="sub">${esc(e.kind)} · ${esc(e.rule)} · ${esc(e.confidence)}</div>`;
      return html;
    },
  };
  function stackedBar(breakdown) {
    const parts = Object.entries(breakdown || {}).filter(([, v]) => v > 0);
    const total = parts.reduce((s, [, v]) => s + v, 0);
    if (!total) return "";
    const segs = parts.map(([c, v]) => `<span style="width:${(100 * v / total).toFixed(1)}%;background:var(--${CATS.includes(c) ? c : "other"})"></span>`).join("");
    const legend = parts.map(([c, v]) => `<i style="--c:var(--${CATS.includes(c) ? c : "other"})"></i>${esc(c)} ${fmt.n(v)}`).join(" · ");
    return `<div class="bar">${segs}</div><div class="breakdown">${legend}</div>`;
  }

  // ---------------------------------------------------------------- header / KPI strip / legend
  function shapeText(s) {
    if (!s) return "";
    const parts = [`${Math.trunc(s.hop_count || 0)} hops`];
    if (s.parallel_groups) parts.push(`${Math.trunc(s.parallel_groups)} parallel group(s) saving ${fmt.n(s.parallel_savings_ms)} ms`);
    if (s.fanout_copies) parts.push(`fan-out ×${Math.trunc(s.fanout_copies)} costed once`);
    if (s.wait_ms) parts.push(`${fmt.n0(s.wait_ms)} ms of waits`);
    return parts.join("; ");
  }
  function renderHeader() {
    const r = data.report, g = data.graph;
    $("#meta").innerHTML = `${esc(g.source_format || "graph")} · <b>${Object.keys(g.nodes).length}</b> nodes · <b>${g.edges.length}</b> edges` +
      ` · ${esc(r.generated_at || "")} · profile ${esc((r.profile && r.profile.sources || []).join(" → "))}`;
    const tabs = $("#tabs"); tabs.innerHTML = "";
    r.scenarios.forEach((s, i) => {
      const b = document.createElement("button");
      b.setAttribute("role", "tab"); b.id = `tab-${i}`; b.dataset.index = i;
      b.innerHTML = `${esc(s.name)}<small>${fmt.ms(s.total_ms)}</small>`;
      b.addEventListener("click", () => set({ scenario: i, selected: null }));
      tabs.appendChild(b);
    });
    const bind = (id, k) => { const c = $(id); c.checked = state[k]; c.addEventListener("change", () => set({ [k]: c.checked })); };
    bind("#t-network", "showNetwork"); bind("#t-alledges", "allEdges"); bind("#t-allhops", "allHops"); bind("#t-fit", "fit");
    if (g.edges.length > 1000) { const c = $("#t-alledges"); c.disabled = true; c.parentElement.title = `${g.edges.length} edges — the request map only`; }
  }
  function kpi(label, value, extra = "", cls = "") {
    return `<div class="kpi ${cls}"><div class="label">${esc(label)}</div><div class="value ${extra}">${value}</div></div>`;
  }
  function renderKpis() {
    const s = currentRaw(), r = data.report; if (!s) { $("#kpis").innerHTML = ""; return; }
    const p = s.percentiles || {}, tiles = [];
    tiles.push(kpi(s.samples ? "mean" : "total", `${fmt.n(s.total_ms)}<small> ms</small>`));
    if (p.p50 !== undefined) tiles.push(kpi("tail", ["p50", "p95", "p99"].filter((k) => p[k] !== undefined).map((k) => `<small>${k}</small> ${fmt.n(p[k])}`).join(" · ")));
    if (s.samples) tiles.push(kpi("samples", fmt.n0(s.samples)));
    tiles.push(kpi("hops", `${s.hops.length}<small> · ${esc(s.source)}</small>`));
    tiles.push(kpi("shape", esc(shapeText(s.shape)), "text"));
    const ftb = r.capacity && r.capacity.first_to_break;
    if (ftb) tiles.push(`<div class="kpi accent"><a href="#capacity"><div class="label">breaks at</div>` +
      `<div class="value">~${fmt.n0(ftb.users)}<small> users · ${esc(displayName(ftb.resource))}</small></div></a></div>`);
    $("#kpis").innerHTML = tiles.join("");
  }
  function renderLegend() {
    const out = [];
    for (const k of KINDS) out.push(`<span style="--c:var(--${k})">${k}</span>`);
    for (const c of CATS) out.push(`<span class="edge" style="--c:var(--${c})">${c}</span>`);
    out.push(`<span class="slowest">slowest hop</span>`, `<span class="badge">hop on the critical path</span>`, `<span class="hollow">hop off the critical path</span>`);
    $("#legend").innerHTML = out.join("");
  }
  function notice(html) { const n = $("#notice"); n.innerHTML = html; n.hidden = false; }

  // ---------------------------------------------------------------- findings (WP2)
  // The right rail (where the time goes · top bottlenecks · recommendations), the hop /
  // critical-path / tail-risk tables and the warnings — Brief order, Brief titles.
  // Rebuilt by redraw(); hover and selection only toggle classes (syncFindings).
  // Numbers come from the findings themselves, never from pre-formatted cells.
  const sectionTitle = (k, fallback) => ((data.sections || []).find((s) => s.key === k) || {}).title || fallback;
  const catVar = (c) => `var(--${CATS.includes(c) ? c : "other"})`;
  const findingsOf = (raw, k) => (raw && raw.findings && raw.findings[k]) || [];
  const g = (x) => String(Number(x) || 0);                          // Python's `:g`
  const partition = (s, sep) => { const i = s.indexOf(sep); return i < 0 ? [s, ""] : [s.slice(0, i), s.slice(i + sep.length)]; };
  const ARROW = " → ";
  // "src → dst" (finding.refs, hop labels, tail-risk subjects) → the drawn edge key
  function refKeys(refs) {
    const keys = new Set();
    for (const r of refs || []) { const i = r.indexOf(ARROW); if (i > 0) keys.add(drawnKey(key(r.slice(0, i), r.slice(i + ARROW.length)))); }
    return keys;
  }
  function refName(subject) {                                        // BriefBuilder.name(): both ends renamed
    const i = subject.indexOf(ARROW);
    return i > 0 ? `${displayName(subject.slice(0, i))} → ${displayName(subject.slice(i + ARROW.length))}` : displayName(subject);
  }
  // hover / focus on a row or card lights the hops (and nodes) it is about on the map
  function hoverRefs(node, refs, ids) {
    const hi = { keys: refKeys(refs), nodes: new Set(ids || []) };
    if (!hi.keys.size && !hi.nodes.size) return;
    node.addEventListener("mouseenter", () => set({ highlight: hi }));
    node.addEventListener("mouseleave", () => set({ highlight: null }));
    node.addEventListener("focusin", () => set({ highlight: hi }));
    node.addEventListener("focusout", () => set({ highlight: null }));
  }
  // a row about exactly one hop also selects that edge on click / Enter / Space
  function wireRow(tr, refs) {
    hoverRefs(tr, refs);
    const keys = [...refKeys(refs)];
    if (keys.length !== 1) return;
    const ref = { type: "edge", key: keys[0] };
    tr.dataset.key = keys[0]; tr.tabIndex = 0;
    tr.addEventListener("click", () => select(ref));
    tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(ref); } });
  }
  function focusNode(id) {                                           // bottleneck click → the map
    set({ selected: { type: "node", id } });
    const node = $(`#svg .node[data-id="${CSS.escape(id)}"]`);
    if (node && node.scrollIntoView) node.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  function section(id, k, fallback, cls) {
    const s = document.createElement("section"); s.id = id; s.className = cls;
    s.innerHTML = `<h2>${esc(sectionTitle(k, fallback))}</h2>`;
    return s;
  }
  function miniBar(share, title) {
    return `<span class="mini" role="img" aria-label="${esc(title)}" title="${esc(title)}"><span style="width:${(100 * Math.max(0, Math.min(1, share))).toFixed(1)}%"></span></span>`;
  }
  function miniStack(breakdown) {                                    // widths relative to the row's own total
    const parts = Object.entries(breakdown || {}).filter(([, v]) => v > 0), total = parts.reduce((t, [, v]) => t + v, 0);
    if (!total) return "";
    const label = parts.map(([c, v]) => `${c} ${fmt.n(v)}`).join(" · ");
    return `<span class="mini stack" role="img" aria-label="${esc(label)}" title="${esc(label)}">` +
      parts.map(([c, v]) => `<span style="width:${(100 * v / total).toFixed(1)}%;background:${catVar(c)}" title="${esc(c)} ${fmt.ms(v)}"></span>`).join("") + `</span>`;
  }
  function groupChip(group) {                                        // "parallel1/branch2" → "P1 · b2"
    const m = /^parallel(\d+)\/branch(\d+)$/.exec(group || "");
    return `<span class="chip" title="${esc(group)}">${m ? `P${m[1]} · b${m[2]}` : esc(group)}</span>`;
  }

  function renderFindings() {
    const raw = currentRaw(), sc = current();
    if (!raw || !sc) { for (const id of ["#rail", "#tables", "#warnings"]) $(id).innerHTML = ""; return; }
    renderRail(raw); renderTables(raw, sc); renderWarnings(raw);
  }
  function syncFindings() {
    const sel = state.selected, hov = state.hover;
    for (const tr of $$("#tables tr[data-key]")) {
      const k = tr.dataset.key;
      tr.classList.toggle("selected", !!sel && sel.type === "edge" && sel.key === k);
      tr.classList.toggle("hover", !!hov && hov.type === "edge" && hov.key === k);
    }
    for (const li of $$("#rail [data-id]")) {
      const id = li.dataset.id;
      li.classList.toggle("selected", !!sel && sel.type === "node" && sel.id === id);
      li.classList.toggle("hover", !!hov && hov.type === "node" && hov.id === id);
    }
  }

  // --- the rail
  function renderRail(raw) {
    const rail = $("#rail"); rail.innerHTML = "";
    const cats = findingsOf(raw, "per_category"), nodes = findingsOf(raw, "per_node"), recs = findingsOf(raw, "recommendations");
    if (cats.length) rail.appendChild(whereSection(cats));
    if (nodes.length) rail.appendChild(bottlenecksSection(nodes.slice(0, 5)));
    if (recs.length) rail.appendChild(recommendationsSection(recs));
  }
  function whereSection(cats) {
    const s = section("where", "where", "Where the time goes", "rail-section");
    const additive = cats.filter((c) => c.additive).sort((a, b) => b.latency_ms - a.latency_ms);
    const total = additive.reduce((t, c) => t + c.share, 0) || 1;   // the shares sum to 1.0; guard anyway
    const bar = document.createElement("div"); bar.className = "bar where-bar"; bar.setAttribute("role", "img");
    bar.setAttribute("aria-label", additive.map((c) => `${c.subject} ${fmt.pct(c.share)}`).join(", "));
    for (const c of additive) {
      const seg = document.createElement("span");
      seg.style.width = `${(100 * c.share / total).toFixed(1)}%`; seg.style.background = catVar(c.subject);
      seg.title = `${c.subject} · ${fmt.ms(c.latency_ms)} · ${fmt.pct(c.share)}`;
      bar.appendChild(seg);
    }
    s.appendChild(bar);
    for (const c of additive) {
      const row = document.createElement("div"); row.className = "where-row";
      row.innerHTML = `<span class="chip layer">${esc(c.layer || "")}</span><span><i class="swatch" style="--c:${catVar(c.subject)}"></i><b>${esc(c.subject)}</b></span>` +
        `<span class="num">${fmt.ms(c.latency_ms)}</span><span class="num pct">${fmt.pct(c.share)}</span><div class="detail">${esc(c.detail)}</div>`;
      hoverRefs(row, c.refs);
      s.appendChild(row);
    }
    const facts = cats.filter((c) => !c.additive);
    if (facts.length) {                                              // service · hops · parallel_savings · fan-out
      const ul = document.createElement("ul"); ul.className = "facts";
      ul.innerHTML = facts.map((c) => `<li>${c.layer ? `<span class="chip layer">${esc(c.layer)}</span>` : ""}<b>${esc(c.subject)}</b> ` +
        `${c.subject === "parallel_savings" || c.subject === "service" ? fmt.ms(c.latency_ms) : g(c.latency_ms)} <span class="detail">— ${esc(c.detail)}</span></li>`).join("");
      s.appendChild(ul);
    }
    return s;
  }
  function bottlenecksSection(nodes) {
    const s = section("bottlenecks", "bottlenecks", "Top bottlenecks", "rail-section");
    const ol = document.createElement("ol"); ol.className = "ranked";
    nodes.forEach((n, i) => {
      const li = document.createElement("li"); li.dataset.id = n.subject;
      li.innerHTML = `<span class="rank">${i + 1}</span><button type="button" class="linkish" title="show on the map">${esc(displayName(n.subject))}</button>` +
        `<span class="num">${fmt.ms(n.latency_ms)}</span>${miniBar(n.share, fmt.pct(n.share))}<span class="num pct">${fmt.pct(n.share)}</span><div class="detail">${esc(n.detail)}</div>`;
      li.querySelector("button").addEventListener("click", () => focusNode(n.subject));
      hoverRefs(li, n.refs, [n.subject]);
      ol.appendChild(li);
    });
    s.appendChild(ol);
    return s;
  }
  function recommendationsSection(recs) {
    const s = section("recommendations", "recommendations", "Recommendations", "rail-section");
    for (const r of recs) {
      const [why, basedOn] = partition(r.detail || "", ". Based on: ");
      const card = document.createElement("article"); card.className = "rec";
      card.innerHTML = `<div class="rec-head"><b>${esc(r.subject)}</b><span class="saves">saves ~${fmt.n0(r.latency_ms)} ms <small>(${fmt.pct(r.share)})</small></span></div>` +
        `<div>${esc(why)}</div>` + (basedOn ? `<details><summary>based on</summary>${esc(basedOn)}</details>` : "");
      hoverRefs(card, r.refs);
      s.appendChild(card);
    }
    return s;
  }

  // --- the tables
  function renderTables(raw, sc) {
    const t = $("#tables"); t.innerHTML = "";
    t.appendChild(hopsSection(sc));
    const cp = findingsOf(raw, "critical_path"); if (cp.length) t.appendChild(criticalPathSection(cp));
    const tail = findingsOf(raw, "tail_risk"); if (tail.length) t.appendChild(tailRiskSection(tail));
  }
  function tableIn(s, head, caption = "") {
    const wrap = document.createElement("div"); wrap.className = "table-wrap";
    const table = document.createElement("table"); table.className = "findings";
    table.innerHTML = (caption ? `<caption>${esc(caption)}</caption>` : "") + `<thead><tr>${head}</tr></thead>`;
    const tbody = document.createElement("tbody"); table.appendChild(tbody);
    wrap.appendChild(table); s.appendChild(wrap);
    return tbody;
  }
  function hopsSection(sc) {
    const s = section("hops", "hops", "Hops", "table-section");
    const hops = sc.hops, n = hops.length, topN = Math.max(1, data.options.top_n || 10);
    let shown, intro;
    if (state.allHops || n <= topN) { shown = hops; intro = `all ${n} hops in path order`; }
    else {
      shown = [...hops].sort((a, b) => b.latency_ms - a.latency_ms).slice(0, topN).sort((a, b) => a.index - b.index);
      intro = `top ${shown.length} of ${n} hops by ms, in path order — tick “all hops” for every hop`;
    }
    const sampled = hops.some((h) => h.percentiles && h.percentiles.p99 !== undefined);
    const grouped = hops.some((h) => h.group);
    const tbody = tableIn(s, `<th>#</th><th title="on the critical path">crit</th>${grouped ? "<th>group</th>" : ""}<th>hop</th><th class="num">ms</th>` +
      `${sampled ? '<th class="num">p50</th><th class="num">p99</th>' : ""}<th>breakdown</th><th>evidence</th>`, intro);
    let prev = null;
    for (const h of shown) {
      const tr = document.createElement("tr"), p = h.percentiles || {};
      const run = h.group && h.group === prev;                       // consecutive rows of one group share a left border
      tr.innerHTML = `<td class="num">${h.index}</td><td class="crit" title="${h.on_critical_path ? "on" : "off"} the critical path">${h.on_critical_path ? "●" : "○"}</td>` +
        (grouped ? `<td class="grp${h.group ? " in" : ""}">${h.group && !run ? groupChip(h.group) : ""}</td>` : "") +
        `<td class="hop">${esc(hopName(h))}</td><td class="num">${fmt.n(h.latency_ms)}</td>` +
        (sampled ? `<td class="num">${p.p50 !== undefined ? fmt.n(p.p50) : ""}</td><td class="num">${p.p99 !== undefined ? fmt.n(p.p99) : ""}</td>` : "") +
        `<td>${miniStack(h.breakdown)}</td><td class="evidence">${esc(h.evidence || "")}</td>`;
      wireRow(tr, [h.label || `${h.src}${ARROW}${h.dst}`]);
      tbody.appendChild(tr);
      prev = h.group || null;
    }
    return s;
  }
  function criticalPathSection(branches) {
    const s = section("critical-path", "critical_path", "Critical path", "table-section");
    const tbody = tableIn(s, `<th>branch</th><th class="num">ms</th><th>verdict</th>`);
    for (const b of branches) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="branch">${esc(b.subject)}</td><td class="num">${fmt.n(b.latency_ms)}</td><td class="why">${esc(b.detail)}</td>`;
      hoverRefs(tr, b.refs);
      tbody.appendChild(tr);
    }
    return s;
  }
  function tailRiskSection(lines) {
    const s = section("tail-risk", "tail_risk", "Tail risk (p99 − p50)", "table-section");
    const sentences = lines.filter((t) => !t.subject.includes(ARROW)), rows = lines.filter((t) => t.subject.includes(ARROW));
    for (const t of sentences) {                                     // the scenario line: "p99 − p50" spread, p50 · p95 · p99 over N samples
      const p = document.createElement("p"); p.className = "tail-intro";
      p.innerHTML = `<b>${esc(t.subject)}</b> ${fmt.ms(t.latency_ms)} <span class="detail">— ${esc(t.detail)}</span>`;
      s.appendChild(p);
    }
    if (rows.length) {
      const tbody = tableIn(s, `<th>hop</th><th class="num">p99 − p50</th><th>share of spread</th><th>why</th>`);
      for (const t of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td class="hop">${esc(refName(t.subject))}</td><td class="num">${fmt.n(t.latency_ms)}</td>` +
          `<td class="share">${miniBar(t.share, fmt.pct(t.share))}<span class="num pct">${fmt.pct(t.share)}</span></td><td class="why">${esc(t.detail)}</td>`;
        wireRow(tr, t.refs && t.refs.length ? t.refs : [t.subject]);
        tbody.appendChild(tr);
      }
    }
    return s;
  }

  // --- warnings: the scenario's, then the graph's once
  function renderWarnings(raw) {
    const items = (raw.warnings || []).map((m) => `<li>${esc(m)}</li>`)
      .concat((data.graph.warnings || []).map((m) => `<li><span class="chip">graph</span>${esc(m)}</li>`));
    $("#warnings").innerHTML = items.length ? `<h2>${esc(sectionTitle("warnings", "Warnings"))}</h2><ul class="warnings">${items.join("")}</ul>` : "";
  }

  // ---------------------------------------------------------------- diff page (minimal until WP5)
  function renderDiff(diff) {
    const after = diff.graphs && diff.graphs.after, before = diff.graphs && diff.graphs.before;
    const counts = {}; for (const g of [before, after]) for (const n of Object.values((g && g.nodes) || {})) if (n.label) counts[n.label] = (counts[n.label] || 0) + 1;
    const name = (id) => displayName(id, (after && after.nodes[id]) ? after : before, counts);
    const edgeName = (e) => (typeof e === "string" ? e : `${name(e.src || e[0])} → ${name(e.dst || e[1])}`);
    $("#meta").innerHTML = `<b>${esc(diff.before)}</b> → <b>${esc(diff.after)}</b> · ${esc(diff.generated_at || "")} · profile ${esc((diff.profile_sources || []).join(" → "))}`;
    for (const id of ["#tabs", "#toggles", "#map", "#rail", "#legend", "#capacity", "#warnings"]) $(id).hidden = true;
    const tiles = diff.scenarios.map((s) => {
      const dir = s.delta_ms > 0 ? "worse" : s.delta_ms < 0 ? "better" : "";
      const sign = s.delta_ms > 0 ? "+" : "";
      const pct = s.delta_pct === null || s.delta_pct === undefined ? "" : ` (${sign}${fmt.n0(s.delta_pct * 100)} %)`;
      return `<div class="tile"><div class="name">${esc(s.name)}</div>` +
        (s.status === "both" ? `<div>${fmt.ms(s.before_ms)} → ${fmt.ms(s.after_ms)}</div><div class="delta ${dir}">${sign}${fmt.ms(s.delta_ms)}${esc(pct)}</div>`
                             : `<div class="sub">${esc(s.status.replace("_", " "))}</div>`) + `</div>`;
    });
    $("#kpis").innerHTML = tiles.join("") || `<div class="kpi"><div class="value text">no scenarios on either side</div></div>`;
    const g = diff.graph || {}, items = [];
    for (const m of g.nodes_moved || []) items.push(`<li><b>${esc(name(m.node_id))}</b> (${esc(m.field)}): <code>${esc(m.before)}</code> → <code>${esc(m.after)}</code></li>`);
    for (const id of g.nodes_added || []) items.push(`<li>added <b>${esc(name(id))}</b></li>`);
    for (const id of g.nodes_removed || []) items.push(`<li>removed <b>${esc(name(id))}</b></li>`);
    for (const e of g.edges_added || []) items.push(`<li>added edge ${esc(edgeName(e))}</li>`);
    for (const e of g.edges_removed || []) items.push(`<li>removed edge ${esc(edgeName(e))}</li>`);
    $("#tables").innerHTML = `<h2>What changed</h2>` + (items.length ? `<ul class="changes">${items.join("")}</ul>` : `<div class="sub">no graph change — the numbers moved for another reason (profile, scenarios)</div>`);
  }

  // ---------------------------------------------------------------- capacity (WP4)
  // "users until it breaks" — the `--walker load` sweep: a utilisation heatmap
  // (rows = resources, columns = the users list), the p99-by-users line chart
  // whose columns line up with the heatmap's, and the "what breaks first" callout.
  // Renders only when `capacity.users` is non-empty; otherwise #capacity stays empty
  // (and hidden). Series colours are the eight categorical slots --s1..--s8, assigned
  // by scenario index and never re-ordered; a ninth scenario folds to --other.
  const SERIES_SLOTS = 8;
  const CAP = { labelW: 240, plotH: 200, padT: 22, padB: 30, padR: 8 };
  const capacity = {
    section: () => $("#capacity"),
    cap() { const c = data.report && data.report.capacity; return c && Array.isArray(c.users) && c.users.length ? c : null; },
    title(key, fallback) { const s = data.sections.find((x) => x.key === key); return s ? s.title : fallback; },
    label(c, key) { const r = c.resources && c.resources[key]; return (r && r.label) || displayName(key); },
    nodeIds(c, key) {           // the map nodes a resource stands for: itself, or its pool members
      const r = (c.resources && c.resources[key]) || {};
      return [key, ...(r.members || [])].filter((id) => data.graph.nodes[id]);
    },
    // the load findings are the same on every scenario (the sweep is per run), so
    // first_to_break / resource: / ceiling come from the first scenario that has any
    findings(subject) {
      for (const s of data.report.scenarios) {
        const all = ((s.findings && s.findings.saturation) || []).filter((f) => subject(f.subject));
        if (all.length) return all;
      }
      return [];
    },
    seriesColour: (i) => (i < SERIES_SLOTS ? `var(--s${i + 1})` : "var(--other)"),
    // hover / focus → the resource's node(s) lit on the map; the rail's helper when it is there
    wireHighlight(node, ids) {
      if (!ids.length) return;
      if (typeof hoverRefs === "function") { hoverRefs(node, [], ids); return; }
      const on = () => set({ highlight: { nodes: new Set(ids) } }), off = () => set({ highlight: null });
      node.addEventListener("mouseenter", on); node.addEventListener("focusin", on);
      node.addEventListener("mouseleave", off); node.addEventListener("focusout", off);
    },

    render() {
      const c = this.cap(), root = this.section();
      if (!c) { root.innerHTML = ""; return; }
      const t = c.thresholds || {};
      const thresholds = [t.p99_ms !== undefined ? `p99 threshold ${fmt.n0(t.p99_ms)} ms` : "",
                          t.utilisation !== undefined ? `utilisation threshold ${fmt.pct(t.utilisation)}` : ""].filter(Boolean).join(" · ");
      root.innerHTML =
        `<h2 id="cap-title">${esc(this.title("capacity", "users until it breaks"))}</h2>` +
        `<div class="cap-meta">` +
          ((c.assumptions || []).length ? `<div><b>assumes</b> ${c.assumptions.map(esc).join("; ")}</div>` : "") +
          (thresholds ? `<div>${esc(thresholds)}</div>` : "") +
        `</div>` +
        `<h3>${esc(this.title("utilisation", "Utilisation by users"))}</h3><div class="cap-heat"></div>` +
        `<h3>${esc(this.title("p99_sweep", "p99 by users"))}</h3><div class="cap-chart"></div>` +
        `<h3>${esc(this.title("saturation", "What breaks first"))}</h3><div class="cap-breaks"></div>`;
      this.heatmap(c);
      this.chart(c);
      this.breaks(c);
      this.observe();
    },

    // ---- the heatmap: a real table; the fill repeats the number, never replaces it
    heatmap(c) {
      const users = c.users, last = String(users[users.length - 1]);
      const util = c.utilisation || {};
      const rho = (u, k) => { const row = util[String(u)]; return row ? row[k] : undefined; };
      const keys = Object.keys(c.resources || {});
      for (const row of Object.values(util)) for (const k of Object.keys(row)) if (!keys.includes(k)) keys.push(k);
      const rank = (k) => { const v = rho(last, k); return v === null ? Infinity : v === undefined ? -1 : v; };
      keys.sort((a, b) => rank(b) - rank(a) || this.label(c, a).localeCompare(this.label(c, b)));
      const limit = Number((c.thresholds || {}).utilisation);
      const cell = (u, k) => {
        const v = rho(u, k);
        if (v === undefined) return `<td class="cell none">–</td>`;
        if (v === null || v >= 1) return `<td class="cell sat" title="saturated: ρ ${v === null ? "∞" : v.toFixed(2)} at ${fmt.n0(u)} users"><span>SAT</span></td>`;
        const hot = !Number.isNaN(limit) && v >= limit;
        return `<td class="cell${hot ? " hot" : ""}" style="--mix:${Math.round(Math.min(1, v) * 70)}%" title="ρ ${v.toFixed(3)} at ${fmt.n0(u)} users">${fmt.pct(v)}</td>`;
      };
      const capText = (r) => (r.slots !== null && r.slots !== undefined ? `${fmt.n0(r.slots)} slots` : r.rps !== null && r.rps !== undefined ? `${fmt.n0(r.rps)} rps` : "");
      const rows = keys.map((k) => {
        const r = (c.resources || {})[k] || {};
        return `<tr tabindex="0" data-key="${esc(k)}">` +
          `<th scope="row" title="${esc(r.source || k)}">${esc(this.label(c, k))}<small>${esc([r.subtype, capText(r)].filter(Boolean).join(" · "))}</small></th>` +
          users.map((u) => cell(u, k)).join("") + `</tr>`;
      }).join("");
      const host = $("#capacity .cap-heat");
      host.innerHTML = `<table class="heat" aria-labelledby="cap-title"><colgroup><col class="lbl">${users.map(() => "<col>").join("")}</colgroup>` +
        `<thead><tr><th scope="col">resource</th>${users.map((u) => `<th scope="col">${fmt.n0(u)}<small>users</small></th>`).join("")}</tr></thead>` +
        `<tbody>${rows}</tbody></table>`;
      for (const tr of $$("tbody tr", host)) this.wireHighlight(tr, this.nodeIds(c, tr.dataset.key));
    },

    // ---- p99 by users: inline SVG, columns at the heatmap's column centres
    geometry() {
      const host = $("#capacity .cap-chart");
      const W = Math.max(480, Math.round(host.clientWidth || host.parentElement.clientWidth || 800));
      const labelW = Math.min(CAP.labelW, Math.round(W * 0.35));
      const colW = (W - labelW - CAP.padR) / Math.max(1, this.cap().users.length);
      const table = $("#capacity .heat");
      if (table) { const col = table.querySelector("col.lbl"); if (col) col.style.width = `${labelW}px`; table.style.width = `calc(100% - ${CAP.padR}px)`; }
      return { W, labelW, colW, H: CAP.padT + CAP.plotH + CAP.padB, x: (i) => labelW + (i + 0.5) * colW };
    },
    ticks(max, want = 5) {
      if (!(max > 0)) return [0, 1];
      const raw = max / (want - 1), mag = 10 ** Math.floor(Math.log10(raw));
      const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => max / s <= want - 1) || 10 * mag;
      const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(Math.round(v * 1000) / 1000);
      if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
      return out;
    },
    chart(c) {
      const host = $("#capacity .cap-chart"); if (!host) return;
      const users = c.users, G = this.geometry(), limit = Number((c.thresholds || {}).p99_ms);
      const series = data.report.scenarios.map((s, i) => ({ i, name: s.name, load: s.load })).filter((s) => s.load && s.load.traffic && s.load.latency);
      const point = (s, u) => (s.load.latency[String(u)] || {});
      let ymax = Number.isNaN(limit) ? 0 : limit;
      for (const s of series) for (const u of users) { const p = point(s, u); if (p.p99_ms !== null && p.p99_ms !== undefined) ymax = Math.max(ymax, p.p99_ms); }
      const ticks = this.ticks(ymax), top = ticks[ticks.length - 1] || 1;
      const y = (v) => CAP.padT + CAP.plotH - (CAP.plotH * v) / top;
      const svg = el("svg", { class: "p99", viewBox: `0 0 ${G.W} ${G.H}`, width: G.W, height: G.H, role: "img",
                              "aria-label": `p99 latency by users for ${series.length} scenario(s)` });
      const grid = el("g", { class: "grid" }, svg), axis = el("g", { class: "axis" }, svg);
      for (const v of ticks) {
        el("line", { x1: G.labelW, x2: G.W - CAP.padR, y1: y(v), y2: y(v) }, grid);
        el("text", { x: G.labelW - 8, y: y(v) + 4, "text-anchor": "end" }, axis).textContent = fmt.n0(v);
      }
      el("text", { x: G.labelW - 8, y: CAP.padT - 10, "text-anchor": "end", class: "unit" }, axis).textContent = "p99 ms";
      users.forEach((u, i) => { el("text", { x: G.x(i), y: G.H - 10, "text-anchor": "middle" }, axis).textContent = fmt.n0(u); });
      el("text", { x: G.W - CAP.padR, y: G.H - 10, "text-anchor": "end", class: "unit" }, axis).textContent = "users";
      if (!Number.isNaN(limit)) {
        el("line", { class: "rule", x1: G.labelW, x2: G.W - CAP.padR, y1: y(limit), y2: y(limit) }, svg);
        el("text", { class: "rule-label", x: G.W - CAP.padR, y: y(limit) < CAP.padT + 14 ? y(limit) + 13 : y(limit) - 5, "text-anchor": "end" }, svg).textContent = `p99 threshold ${fmt.n0(limit)} ms`;
      }
      const satAt = {};                                   // users index → how many SAT chips sit there already
      const lines = el("g", { class: "lines" }, svg), marks = el("g", { class: "marks" }, svg);
      for (const s of series) {
        const sel = s.i === state.scenario, colour = this.seriesColour(s.i);
        const g = el("g", { class: `series${sel ? " sel" : ""}`, style: `--c:${colour}` }, sel ? marks : lines);
        const pts = [];
        let stopped = false;
        users.forEach((u, i) => {
          if (stopped) return;
          const p = point(s, u);
          if (p.saturated || p.p99_ms === null || p.p99_ms === undefined) {
            stopped = true;
            // several scenarios saturating at the same users level sit side by side, growing away from the nearer edge
            const k = satAt[i] = (satAt[i] || 0) + 1, cx = G.x(i) + (k - 1) * 34 * (i * 2 >= users.length ? -1 : 1), cy = CAP.padT - 6;
            if (pts.length) { const l = pts[pts.length - 1]; el("line", { class: "to-sat", x1: l.x, y1: l.y, x2: cx, y2: cy + 8 }, g); }
            const m = el("g", { class: "sat-mark", transform: `translate(${cx},${cy})`, tabindex: 0, role: "img",
                               "aria-label": `${s.name} saturated at ${fmt.n0(u)} users` }, g);
            el("rect", { x: -16, y: -7, width: 32, height: 14, rx: 3 }, m);
            el("text", { y: 4, "text-anchor": "middle" }, m).textContent = "SAT";
            this.hoverable(m, () => this.tip(s, u, p));
            return;
          }
          pts.push({ x: G.x(i), y: y(p.p99_ms), u, p });
        });
        if (pts.length > 1) el("path", { d: pts.map((q, j) => `${j ? "L" : "M"}${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(" ") }, g);
        for (const q of pts) {
          el("circle", { class: "pt", cx: q.x, cy: q.y, r: sel ? 4 : 3 }, g);
          const hit = el("circle", { class: "hit", cx: q.x, cy: q.y, r: 12, tabindex: 0, role: "img",
                                     "aria-label": `${s.name}: p99 ${fmt.n0(q.p.p99_ms)} ms at ${fmt.n0(q.u)} users` }, g);
          this.hoverable(hit, () => this.tip(s, q.u, q.p));
        }
        if (sel && pts.length) {                          // one direct label: the emphasised series' last value
          const q = pts[pts.length - 1];
          el("text", { class: "end-label", x: q.x, y: q.y - 9, "text-anchor": "middle" }, g).textContent = `${fmt.n0(q.p.p99_ms)} ms`;
        }
      }
      host.innerHTML = "";
      if (!series.length) { host.innerHTML = `<div class="cap-meta">no scenario receives traffic in load.yaml — nothing to plot</div>`; return; }
      host.appendChild(svg);
      // legend: one entry per scenario, in scenario order; click selects it on the whole page
      const legend = document.createElement("div"); legend.className = "cap-legend"; legend.setAttribute("aria-label", "scenarios");
      data.report.scenarios.forEach((s, i) => {
        const drawn = series.some((x) => x.i === i);
        const b = document.createElement("button"); b.type = "button";
        b.setAttribute("aria-pressed", String(i === state.scenario));
        b.innerHTML = `<i style="--c:${drawn ? this.seriesColour(i) : "transparent"}"></i>${esc(s.name)}${drawn ? "" : ` <small>no traffic</small>`}`;
        b.addEventListener("click", () => set({ scenario: i, selected: null }));
        legend.appendChild(b);
      });
      host.appendChild(legend);
      // the table twin, so no value is reachable by hover alone
      const rows = series.map((s) => `<tr><th scope="row">${esc(s.name)}</th>` + users.map((u) => {
        const p = point(s, u);
        return `<td>${p.saturated ? "SAT" : p.p99_ms === null || p.p99_ms === undefined ? "–" : fmt.n0(p.p99_ms)}</td>`;
      }).join("") + `</tr>`).join("");
      const twin = document.createElement("details");
      twin.innerHTML = `<summary>p99 by users as a table</summary><table class="p99-table"><thead><tr><th scope="col">scenario</th>${users.map((u) => `<th scope="col">${fmt.n0(u)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
      host.appendChild(twin);
    },
    hoverable(node, html) {
      const show = () => this.showTip(node, html());
      node.addEventListener("mouseenter", show); node.addEventListener("focus", show);
      node.addEventListener("mouseleave", () => this.hideTip()); node.addEventListener("blur", () => this.hideTip());
    },
    tip(s, u, p) {
      const head = `<b>${esc(s.name)}</b> <span class="sub">· ${fmt.n0(u)} users · ${fmt.n(s.load.rps ? s.load.rps[String(u)] : 0)} rps</span>`;
      if (p.saturated) return `${head}<div><b>saturated</b></div><div class="sub">by ${esc((p.saturated_by || []).join(", ") || "—")}</div>`;
      return `${head}<div>p99 <b>${fmt.ms(p.p99_ms)}</b> · expected ${fmt.ms(p.expected_ms)}</div>` +
        ((p.saturated_by || []).length ? `<div class="sub">queueing at ${esc(p.saturated_by.join(", "))}</div>` : "");
    },
    // the page's one tooltip element, placed beside a chart mark (it lives in #map,
    // so coordinates are relative to its offsetParent, wherever that is)
    showTip(node, html) {
      const t = $("#tooltip"); if (!t) return;
      t.innerHTML = html; t.hidden = false;
      const base = (t.offsetParent || document.body).getBoundingClientRect(), box = node.getBoundingClientRect();
      let x = box.left - base.left + box.width / 2 + 10, yy = box.top - base.top - t.offsetHeight - 6;
      x = Math.min(x, base.width - t.offsetWidth - 8);
      t.style.left = `${Math.max(0, x)}px`; t.style.top = `${Math.max(0, yy)}px`;
    },
    hideTip() { const t = $("#tooltip"); if (t) t.hidden = true; },

    // ---- what breaks first: the callout, then the brief's saturation rows and each scenario's p99 line
    breaks(c) {
      const host = $("#capacity .cap-breaks"); if (!host) return;
      const out = [], ftb = c.first_to_break;
      if (ftb) {
        out.push(`<div class="callout"><div class="label">breaks first</div>` +
          `<div class="value"><b>${esc(this.label(c, ftb.resource))}</b> at ~${fmt.n0(ftb.users)} users</div><div class="sub">${esc(ftb.detail || "")}</div></div>`);
      } else {
        out.push(`<div class="callout ok"><div class="label">breaks first</div><div class="value">nothing inside the sweep</div>` +
          `<div class="sub">no resource reaches 100 % utilisation through ${fmt.n0(c.users[c.users.length - 1])} users</div></div>`);
      }
      const rows = this.findings((s) => s !== "scenario_p99" && s !== "first_to_break").map((f) => {
        const kind = f.subject === "ceiling" ? "ceiling" : f.subject.replace(/^resource:/, "");
        return `<tr><td class="kind">${esc(kind)}</td><td class="num">${fmt.n0(f.latency_ms)}</td><td>${esc(f.detail)}</td></tr>`;
      });
      const p99 = data.report.scenarios.map((s) => {
        const f = ((s.findings && s.findings.saturation) || []).find((x) => x.subject === "scenario_p99");
        return f ? `<tr><td class="kind">${esc(s.name)}</td><td class="num">${fmt.n0(f.latency_ms)}</td><td>${esc(f.detail)}</td></tr>` : "";
      }).filter(Boolean);
      if (rows.length || p99.length) {
        out.push(`<table class="breaks"><thead><tr><th scope="col"></th><th scope="col">users</th><th scope="col">finding</th></tr></thead>` +
          `<tbody>${rows.join("")}${p99.length ? `<tr class="group"><th scope="rowgroup" colspan="3">p99 per scenario</th></tr>${p99.join("")}` : ""}</tbody></table>`);
      }
      host.innerHTML = out.join("");
      const callout = host.querySelector(".callout");
      if (callout && ftb) this.wireHighlight(callout, this.nodeIds(c, ftb.resource));
    },
    // the chart is drawn at the container's pixel width, so it follows the layout
    observe() {
      if (this._ro || typeof ResizeObserver === "undefined") return;
      let w = this.section().clientWidth, pending = 0;
      this._ro = new ResizeObserver(() => {
        const now = this.section().clientWidth;
        if (now === w || !this.cap()) return;
        w = now; cancelAnimationFrame(pending);
        pending = requestAnimationFrame(() => this.chart(this.cap()));
      });
      this._ro.observe(this.section());
    },
  };

  // ---------------------------------------------------------------- boot
  function boot() {
    const blob = parseBlob();
    if (!blob || !(blob.report || blob.diff)) {
      notice("No data — run <code>iacsim run &lt;dir&gt; -o html</code> or <code>iacsim view &lt;dir&gt;</code>");
      for (const id of ["#header", "#kpis", "#map", "#legend"]) $(id).hidden = true;
      return;
    }
    data.blob = blob; data.kind = blob.kind; data.options = blob.options || {}; data.sections = blob.sections || [];
    if (blob.kind === "diff") { renderDiff(blob.diff); return; }
    const report = blob.report;
    if (String(report.schema_version) !== "2") notice(`This report is schema ${esc(report.schema_version)}; the dashboard reads schema 2 — some panels may be empty. Re-run <code>iacsim run</code>.`);
    index(report);
    state.allHops = !!data.options.all_hops;
    renderHeader(); renderLegend();
    document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") set({ selected: null, hover: null }); });
    $("#stage").addEventListener("click", () => set({ selected: null }));
    redraw();
  }
  boot();
})();
</script>
</body>
</html>
