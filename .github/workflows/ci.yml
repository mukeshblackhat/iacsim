name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: make check (ruff + pytest + coverage gate)
        run: make check
      - name: make examples (every example parses, runs, diffs)
        run: make examples
      - name: Self-test — a regression past the threshold must exit 2
        run: |
          set +e
          .venv/bin/iacsim diff examples/classic-web examples/classic-web-bad --fail-on-regression 50ms -o json
          code=$?
          set -e
          test "$code" -eq 2
